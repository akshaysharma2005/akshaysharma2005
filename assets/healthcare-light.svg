<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Healthcare Data Analysis — HMIS Dataset">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0"/><stop offset=".5" stop-color="#0284c7" stop-opacity=".06"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="210" fill="#ffffff"/>
<rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
<rect x="28" y="0" width="64" height="1.5" fill="#0284c7"/>
</g>
<rect x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#e2e8f0"/>
<text x="28" y="54" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="27" font-weight="400" letter-spacing="-0.3" fill="#0f172a">Healthcare Analytics</text>
<rect x="470" y="34" width="102" height="26" rx="13" fill="none" stroke="#cbd5e1"/>
<circle class="live" cx="484" cy="47" r="3" fill="#0284c7"/>
<text x="494" y="51.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#475569">HMIS Study</text>
<text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">
<tspan x="28" dy="0">Cleaned &amp; modeled public healthcare datasets with Python &amp; Pandas;</tspan>
<tspan x="28" dy="22">deep exploratory data analysis (EDA) for epidemiological insights.</tspan>
</text>
<rect x="28" y="140" width="72" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="41" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">Python</text>
<rect x="106.2" y="140" width="76" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="119.2" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">Pandas</text>
<rect x="188.4" y="140" width="54" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="201.4" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">EDA</text>
<rect x="248.6" y="140" width="90" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="261.6" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">Matplotlib</text>
<rect x="344.8" y="140" width="84" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="357.8" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">Seaborn</text>
<rect x="435" y="140" width="62" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="448" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#475569">Excel</text>
<text x="572" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#64748b">github.com/akshaysharma2005/Healthcare-Analytics ↗</text>
</svg>
