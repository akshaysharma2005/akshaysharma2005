<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Football Analytics Lab — Tactical Matrix, xG Engine, and Player Radar">
<style>
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(1420px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.08);opacity:0.4}}
.sweep{animation:sweep 7s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
.p-dot{animation:pulse 2s ease-in-out infinite}
</style>
<defs>
<linearGradient id="shineFLight" x1="0" x2="1">
  <stop offset="0" stop-color="#059669" stop-opacity="0"/>
  <stop offset=".5" stop-color="#059669" stop-opacity=".05"/>
  <stop offset="1" stop-color="#059669" stop-opacity="0"/>
</linearGradient>
<clipPath id="fclipLight">
  <rect x="1" y="1" width="1278" height="298" rx="18"/>
</clipPath>
</defs>

<!-- Background -->
<g clip-path="url(#fclipLight)">
  <rect width="1280" height="300" fill="#ffffff"/>
  <rect class="sweep" x="0" y="0" width="140" height="300" fill="url(#shineFLight)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#e2e8f0"/>

<!-- Card Header -->
<circle class="live" cx="44" cy="40" r="3.5" fill="#059669"/>
<text x="58" y="44" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2" fill="#64748b">
  FOOTBALL ANALYTICS LAB · TACTICAL MATRIX &amp; xG ENGINE
</text>
<text x="1236" y="44" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#059669">
  ⚽ POSSESSION · HIGH-PRESSING · SPATIAL THREAT
</text>
<line x1="40" x2="1240" y1="64" y2="64" stroke="#e2e8f0"/>

<!-- 3 Columns Layout -->

<!-- Column 1: Positional Play & Formation -->
<g transform="translate(48, 86)">
  <rect width="360" height="184" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="20" y="32" font-family="'Iowan Old Style', Palatino, serif" font-size="18" fill="#0f172a">Positional Play &amp; Passing</text>
  <text x="20" y="52" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#64748b">SYSTEM: 4-3-3 FLUID POSSESSION</text>

  <!-- Metric 1 -->
  <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#475569">Field Tilt (Territorial Dominance)</text>
  <text x="340" y="86" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#059669">68.4%</text>
  <rect x="20" y="94" width="320" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="20" y="94" width="218" height="6" rx="3" fill="#059669"/>

  <!-- Metric 2 -->
  <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#475569">Pass Completion in Opp. Half</text>
  <text x="340" y="126" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0284c7">89.2%</text>
  <rect x="20" y="134" width="320" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="20" y="134" width="285" height="6" rx="3" fill="#0284c7"/>

  <!-- Metric 3 -->
  <text x="20" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Half-Space Overloads · Inverted Wings · Rest Defense</text>
</g>

<!-- Column 2: Expected Metrics (xG & xT) Engine -->
<g transform="translate(456, 86)">
  <rect width="368" height="184" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="20" y="32" font-family="'Iowan Old Style', Palatino, serif" font-size="18" fill="#0f172a">Expected Goals (xG) Engine</text>
  <text x="20" y="52" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#64748b">STATISTICAL SHOT MODELING &amp; xT</text>

  <!-- Metric 1 -->
  <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#475569">Shot Quality (xG per 90')</text>
  <text x="348" y="86" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#d97706">2.48 <tspan font-size="11" fill="#64748b">(Top 3%)</tspan></text>
  <rect x="20" y="94" width="328" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="20" y="94" width="298" height="6" rx="3" fill="#d97706"/>

  <!-- Metric 2 -->
  <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#475569">PPDA (Pressing Intensity)</text>
  <text x="348" y="126" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#e11d48">7.8 passes</text>
  <rect x="20" y="134" width="328" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="20" y="134" width="270" height="6" rx="3" fill="#e11d48"/>

  <!-- Metric 3 -->
  <text x="20" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Monte Carlo Sim · Logistic Regression on 15k+ Shots</text>
</g>

<!-- Column 3: Playmaker Radar & Analytical Mindset -->
<g transform="translate(872, 86)">
  <rect width="360" height="184" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="20" y="32" font-family="'Iowan Old Style', Palatino, serif" font-size="18" fill="#0f172a">The Playmaker Mindset</text>
  <text x="20" y="52" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#64748b">SPATIAL VISION &amp; DATA INTELLECT</text>

  <!-- Skill Attributes -->
  <g transform="translate(20, 72)">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="12" y="22" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">Spatial IQ: <tspan fill="#059669" font-weight="600">96</tspan></text>

    <rect x="164" y="0" width="156" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="176" y="22" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">Press Res.: <tspan fill="#0284c7" font-weight="600">94</tspan></text>

    <rect x="0" y="44" width="150" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="12" y="66" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">Key Passes: <tspan fill="#d97706" font-weight="600">93</tspan></text>

    <rect x="164" y="44" width="156" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="176" y="66" font-family="ui-monospace, monospace" font-size="11.5" fill="#475569">Match Tempo: <tspan fill="#7c3aed" font-weight="600">95</tspan></text>
  </g>

  <text x="20" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">
    Translating football vision into clean algorithms &amp; data models.
  </text>
</g>
</svg>
