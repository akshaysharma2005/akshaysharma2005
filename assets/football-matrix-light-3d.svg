      <text x="0" y="-9" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#059669">CAM (Hub)</text>
    </g>
    <g transform="translate(246, 28)">
      <polygon points="-4.5,0 4.5,0 4.5,14 -4.5,14" fill="#ecfdf5"/>
