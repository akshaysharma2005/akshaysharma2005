    </g>
    <g transform="translate(116, 62)">
      <polygon points="-5,0 5,0 5,14 -5,14" fill="#e0f2fe"/>
      <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#0284c7"/>
      <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#0284c7">CDM · 94%</text>
    </g>
    <g transform="translate(176, 34)">
      <polygon points="-6,0 6,0 6,18 -6,18" fill="#ecfdf5"/>
