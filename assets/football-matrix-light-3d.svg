    <line class="flow-line" x1="116" y1="62" x2="176" y2="34" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 4"/>
    <line class="flow-line" x1="176" y1="34" x2="246" y2="28" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 4"/>
