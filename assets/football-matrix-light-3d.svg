<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="3D Football Analytics Lab — Ultra 3D Spatial Matrix, Volumetric xG Towers, and Holographic Radar">
<style>
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(1420px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ringPulse{0%{r:4;opacity:0.95}100%{r:16;opacity:0}}
@keyframes radarSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes radarBreath3D{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes dashFlow{to{stroke-dashoffset:-24}}
@keyframes towerGlow{0%,100%{opacity:0.85;filter:drop-shadow(0 0 4px #059669)}50%{opacity:1;filter:drop-shadow(0 0 12px #059669)}}
@keyframes floatBox{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes energyPulse{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-40}}
@keyframes particleFloat{0%{opacity:0;transform:translate(0,0) scale(0.5)}50%{opacity:0.6;transform:scale(1)}100%{opacity:0;transform:translate(10px,-20px) scale(0.3)}}

.sweep{animation:sweep 7s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
.pulse-ring{animation:ringPulse 2.4s cubic-bezier(0,0.2,0.8,1) infinite}
.radar-3d{animation:radarBreath3D 4s ease-in-out infinite;transform-origin:center}
.flow-line{animation:dashFlow 1.2s linear infinite}
.tower-pulse{animation:towerGlow 2.5s ease-in-out infinite}
.floating-elem{animation:floatBox 5s ease-in-out infinite}
.energy-ring{animation:energyPulse 2s linear infinite;fill:none}
.particle{animation:particleFloat 3s ease-in-out infinite}

.hud-panel{transition:all .3s ease;cursor:pointer}
.hud-panel:hover{stroke:#059669;filter:drop-shadow(0 0 10px rgba(5,150,105,0.2))}
.tower-node{transition:transform .2s ease;cursor:pointer}
.tower-node:hover{transform:translateY(-4px)}
</style>
<defs>
<linearGradient id="shineF" x1="0" x2="1">
  <stop offset="0" stop-color="#059669" stop-opacity="0"/><stop offset=".5" stop-color="#059669" stop-opacity=".04"/><stop offset="1" stop-color="#059669" stop-opacity="0"/>
</linearGradient>
<linearGradient id="towerGradGreen" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#059669"/>
</linearGradient>
<linearGradient id="towerGradAmber" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="towerGradBlue" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#0284c7"/>
</linearGradient>
<linearGradient id="towerGradRose" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#ef4444"/>
</linearGradient>
<linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#059669" stop-opacity="0.15"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
</linearGradient>
<pattern id="circuitF" width="48" height="48" patternUnits="userSpaceOnUse">
  <path d="M0 24h14v-8h6v8h4v-14h6v14h18" fill="none" stroke="#059669" stroke-width="0.25" opacity="0.06"/>
  <circle cx="14" cy="16" r="1" fill="#059669" opacity="0.06"/>
</pattern>
<filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
  <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="fclip"><rect x="1" y="1" width="1278" height="298" rx="18"/></clipPath>
</defs>

<g clip-path="url(#fclip)">
  <rect width="1280" height="300" fill="#f8fafc"/>
  <rect width="1280" height="300" fill="url(#circuitF)" opacity="0.5"/>
  <rect class="sweep" x="0" y="0" width="140" height="300" fill="url(#shineF)"/>
  <circle cx="200" cy="150" r="140" fill="#059669" opacity="0.03" filter="url(#softF)"/>
  <circle cx="640" cy="150" r="160" fill="#0284c7" opacity="0.02" filter="url(#softF)"/>
  <circle cx="1080" cy="150" r="140" fill="#7c3aed" opacity="0.02" filter="url(#softF)"/>
</g>

<g opacity="0.2">
  <path d="M20 4 L4 4 L4 20" fill="none" stroke="#059669" stroke-width="1.5"/>
  <path d="M1260 4 L1276 4 L1276 20" fill="none" stroke="#059669" stroke-width="1.5"/>
  <path d="M20 296 L4 296 L4 280" fill="none" stroke="#059669" stroke-width="1.5"/>
  <path d="M1260 296 L1276 296 L1276 280" fill="none" stroke="#059669" stroke-width="1.5"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#cbd5e1"/>

<circle class="live" cx="44" cy="38" r="3.5" fill="#059669"/>
<text x="58" y="42" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2" fill="#94a3b8">
  3D FOOTBALL ANALYTICS LAB · SPATIAL HISTOGRAM &amp; VOLUMETRIC xG
</text>
<g transform="translate(1040, 28)">
  <rect width="196" height="22" rx="11" fill="#ecfdf5" stroke="#059669" stroke-opacity="0.3"/>
  <circle class="live" cx="14" cy="11" r="2.5" fill="#059669"/>
  <text x="98" y="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#059669">⬡ 3D TACTICAL RECONSTRUCTION</text>
</g>
<line x1="40" x2="1240" y1="60" y2="60" stroke="#e2e8f0"/>

<!-- Column 1: 3D Passing Network -->
<g class="hud-panel" transform="translate(48, 76)">
  <rect width="364" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="12" y1="1" x2="120" y2="1" stroke="#059669" stroke-width="2" opacity="0.2"/>
  <text x="18" y="26" font-family="'Iowan Old Style', Palatino, serif" font-size="17" fill="#1e293b">3D Passing Network &amp; Spacing</text>
  <text x="18" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">ISOMETRIC FORMATION: 4-3-3</text>

  <g class="floating-elem" transform="translate(18, 52)">
    <polygon points="10,60 164,12 318,60 164,96" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" stroke-opacity="0.3"/>
    <polygon points="10,60 164,96 164,104 10,68" fill="#ecfdf5" stroke="#059669" stroke-width="0.6" stroke-opacity="0.3"/>
