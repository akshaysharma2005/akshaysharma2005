      <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">RW</text>
    </g>
    <g transform="translate(270, 64)">
      <polygon points="-5,0 5,0 5,20 -5,20" fill="#fef3c7"/>
      <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#d97706"/>
      <circle class="pulse-ring" cx="0" cy="0" r="4" fill="none" stroke="#d97706" stroke-width="1.5" style="animation-delay:1.5s;"/>
      <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#d97706">ST ⚽</text>
    </g>

    <circle r="2.2" fill="#059669" opacity="0.3">
      <animateMotion dur="3.6s" begin="0.2s" repeatCount="indefinite" path="M 48 48 L 116 62 L 176 34 L 246 28 L 270 64"/>
    </circle>
    <circle r="2.8" fill="#1e293b" filter="url(#glowF)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M 48 48 L 116 62 L 176 34 L 246 28 L 270 64"/>
    </circle>
  </g>

  <g transform="translate(18, 160)">
    <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#64748b">Field Tilt: <tspan fill="#059669" font-weight="600">68.4%</tspan></text>
