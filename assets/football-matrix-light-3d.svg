  <rect width="364" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="12" y1="1" x2="120" y2="1" stroke="#d97706" stroke-width="2" opacity="0.2"/>
  <text x="18" y="26" font-family="'Iowan Old Style', Palatino, serif" font-size="17" fill="#1e293b">3D Volumetric xG Shot Map</text>
