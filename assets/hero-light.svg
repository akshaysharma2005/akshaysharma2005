<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="M Akshay Sharma — Data Analytics Specialist and Full-Stack Developer">
<style>
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,25px)}}
@keyframes word{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ringPulse{0%{r:4;opacity:0.95}100%{r:18;opacity:0}}
@keyframes heatBreathe{0%,100%{opacity:0.1;transform:scale(0.96)}50%{opacity:0.25;transform:scale(1.06)}}
@keyframes flowDash{to{stroke-dashoffset:-32}}
@keyframes goalFlash{0%,75%{opacity:0;transform:scale(0.8)}82%,94%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.g1{animation:drift1 15s ease-in-out infinite}
.w0{animation:word 12s infinite;animation-delay:0.0s;opacity:0}
.w1{animation:word 12s infinite;animation-delay:3.0s;opacity:0}
.w2{animation:word 12s infinite;animation-delay:6.0s;opacity:0}
.w3{animation:word 12s infinite;animation-delay:9.0s;opacity:0}
.cur{animation:blink 1s step-end infinite}
.live{animation:live 1.6s ease-in-out infinite}
.pulse-ring{animation:ringPulse 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite}
.heat-cam{animation:heatBreathe 3.5s ease-in-out infinite;transform-origin:945px 170px}
.heat-box{animation:heatBreathe 2.8s ease-in-out infinite;transform-origin:1152px 224px}
.pass-flow{animation:flowDash 1.2s linear infinite}
.goal-burst{animation:goalFlash 4.2s ease-in-out infinite;transform-origin:1196px 224px}
.r1{animation:rise .8s ease-out both}
.r2{animation:rise .8s .15s ease-out both}
.r3{animation:rise .8s .3s ease-out both}
.r4{animation:rise .8s .45s ease-out both}
.r5{animation:rise .8s .6s ease-out both}

.tactical-node{transition:all .3s ease;cursor:pointer}
.tactical-node:hover{transform:scale(1.15);filter:drop-shadow(0 0 8px #059669)}
.chip{transition:all .25s ease;cursor:pointer}
.chip:hover{stroke:#059669;filter:drop-shadow(0 0 6px rgba(5,150,105,0.25))}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</pattern>
<radialGradient id="fade" cx="72%" cy="50%" r="65%">
  <stop offset="0" stop-color="#fff"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<mask id="m">
  <rect width="1280" height="420" fill="url(#fade)"/>
</mask>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="60"/>
</filter>
<filter id="heatBlur" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="18"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
  <feMerge>
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<linearGradient id="pitchGradLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f8fafc"/>
  <stop offset="50%" stop-color="#f0fdf4"/>
  <stop offset="100%" stop-color="#ecfdf5"/>
</linearGradient>
<linearGradient id="radarBeamLight" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
  <stop offset="90%" stop-color="#059669" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
</linearGradient>
<clipPath id="pitchClipLight">
  <rect x="736" y="98" width="480" height="236" rx="14"/>
</clipPath>
<clipPath id="clip">
  <rect x="1" y="1" width="1278" height="418" rx="22"/>
</clipPath>
</defs>

<!-- Main Canvas Background -->
<g clip-path="url(#clip)">
  <rect width="1280" height="420" fill="#ffffff"/>
  <rect width="1280" height="420" fill="url(#grid)" mask="url(#m)"/>
  <circle class="g1" cx="1040" cy="130" r="240" fill="#10b981" opacity="0.08" filter="url(#blur)"/>
  <circle class="g1" cx="780" cy="310" r="170" fill="#0284c7" opacity="0.05" filter="url(#blur)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="none" stroke="#e2e8f0"/>

<!-- Left Column: Identity & Interactive Terminal -->
<g class="r1">
  <circle class="live" cx="68" cy="74" r="3.5" fill="#059669"/>
  <text x="82" y="79" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#64748b">~/akshaysharma2005</text>
  <rect x="234" y="65" width="104" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="286" y="79" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#059669">● SYSTEM READY</text>
</g>

<text class="r2" x="62" y="146" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="52" font-weight="400" letter-spacing="-1.2" fill="#0f172a">M Akshay Sharma</text>

<text class="r3" x="64" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.2" fill="#475569">
  <tspan fill="#0f172a" font-weight="500">Data Analytics Specialist</tspan>
  <tspan fill="#059669">  /  </tspan>
  Full-Stack Developer
</text>

<g class="r4">
  <rect x="64" y="222" width="580" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="82" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#64748b">
    <tspan fill="#059669">$</tspan> now analyzing
  </text>
  <text class="w0" x="256" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#0f172a">
    SoundPulse Streams (8k+ events)<tspan class="cur" fill="#059669">▍</tspan>
  </text>
  <text class="w1" x="256" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#059669">
    Football xG &amp; Spatial Tracking ⚽<tspan class="cur" fill="#059669">▍</tspan>
  </text>
  <text class="w2" x="256" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#0284c7">
    Healthcare HMIS Trends &amp; EDA<tspan class="cur" fill="#059669">▍</tspan>
  </text>
  <text class="w3" x="256" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#d97706">
    AWS Cloud &amp; MERN Architecture<tspan class="cur" fill="#059669">▍</tspan>
  </text>
</g>

<!-- Profile Badges with Interactive Chips -->
<g class="r5">
  <g class="chip">
    <rect x="64" y="286" width="216" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="78" y="306" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#475569">🎓 CSE (Data Analytics) · VIT-AP</text>
  </g>
  
  <g class="chip">
    <rect x="290" y="286" width="200" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="304" y="306" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#475569">☁️ AWS Academy Graduate</text>
  </g>

  <g class="chip">
    <rect x="500" y="286" width="180" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="514" y="306" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#059669">⚽ Football Analytics &amp; xG</text>
  </g>

  <!-- Quick Bio Tagline -->
  <text x="66" y="354" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">
    Optimized SQL · Python EDA · Predictive Sports Intelligence · Cloud-Native Systems
  </text>
</g>

<!-- Right Column: Interactive Tactical Football Analytics HUD -->
<g class="r3">
  <!-- Telemetry Header -->
  <g transform="translate(736, 75)">
    <circle class="live" cx="6" cy="6" r="3.5" fill="#059669"/>
    <text x="18" y="10" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.2" fill="#64748b">MATCHDAY TELEMETRY · ATTACK VECTOR</text>
    <rect x="408" y="-3" width="72" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
    <circle class="live" cx="418" cy="7" r="2.5" fill="#e11d48"/>
    <text x="448" y="11" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#e11d48">92:48' 🔴</text>
  </g>

  <!-- Pitch Container with Clip -->
  <g clip-path="url(#pitchClipLight)">
    <rect x="736" y="98" width="480" height="236" fill="url(#pitchGradLight)" stroke="#cbd5e1"/>

    <!-- Mowing Grass Alternating Bands -->
    <rect x="796" y="98" width="60" height="236" fill="#059669" opacity="0.025"/>
    <rect x="916" y="98" width="60" height="236" fill="#059669" opacity="0.025"/>
    <rect x="1036" y="98" width="60" height="236" fill="#059669" opacity="0.025"/>
    <rect x="1156" y="98" width="60" height="236" fill="#059669" opacity="0.025"/>

    <!-- Animated Radar Sweeping Scanline -->
    <line x1="736" y1="98" x2="736" y2="334" stroke="url(#radarBeamLight)" stroke-width="24" opacity="0.5">
      <animate attributeName="x1" values="736;1216;736" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="736;1216;736" dur="5.5s" repeatCount="indefinite"/>
    </line>

    <!-- Tactical Heatmap Overload Zones -->
    <!-- Half-Space Pocket (CAM) -->
    <ellipse class="heat-cam" cx="945" cy="170" rx="36" ry="22" fill="#0284c7" filter="url(#heatBlur)"/>
    <!-- Danger Box Area (Striker xG) -->
    <ellipse class="heat-box" cx="1152" cy="224" rx="44" ry="28" fill="#10b981" filter="url(#heatBlur)"/>

    <!-- Pitch Markings -->
    <rect x="750" y="110" width="452" height="212" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="976" y1="110" x2="976" y2="322" stroke="#94a3b8" stroke-width="1.4"/>
    <circle cx="976" cy="216" r="38" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <circle cx="976" cy="216" r="2.5" fill="#059669"/>

    <!-- Left Box -->
    <rect x="750" y="144" width="68" height="144" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="750" y="178" width="24" height="76" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="798" cy="216" r="2" fill="#94a3b8"/>
    <path d="M 818 190 A 38 38 0 0 1 818 242" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Right Box (Attacking Goal Box) -->
    <rect x="1134" y="144" width="68" height="144" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="1178" y="178" width="24" height="76" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="1152" cy="216" r="2" fill="#94a3b8"/>
    <path d="M 1134 190 A 38 38 0 0 0 1134 242" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Goal Frame at Right Goalmouth -->
    <rect x="1202" y="196" width="6" height="40" rx="1" fill="#059669" opacity="0.8"/>

    <!-- Interactive Passing Sequence Tracks with Animated Dash-Flow -->
    <!-- Leg 1: CDM -> CAM -->
    <path class="pass-flow" d="M 845 258 Q 890 215 945 170" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
    <!-- Leg 2: CAM -> RW -->
    <path class="pass-flow" d="M 945 170 Q 1000 155 1055 162" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
    <!-- Leg 3: RW -> CF (Cutback cross) -->
    <path class="pass-flow" d="M 1055 162 Q 1110 185 1152 216" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
    <!-- Leg 4: CF -> Goal (Finishing Strike) -->
    <line x1="1152" y1="216" x2="1202" y2="216" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="3 3"/>

    <!-- Glowing Traveling Match Ball (Follows Complete 4-Step Sequence) -->
    <circle r="4.5" fill="#0f172a" filter="url(#glow)">
      <animateMotion dur="4.2s" repeatCount="indefinite" path="M 845 258 Q 890 215 945 170 Q 1000 155 1055 162 Q 1110 185 1152 216 L 1202 216"/>
    </circle>
    <!-- Tracer Comet Tail -->
    <circle r="2.5" fill="#059669">
      <animateMotion dur="4.2s" begin="0.08s" repeatCount="indefinite" path="M 845 258 Q 890 215 945 170 Q 1000 155 1055 162 Q 1110 185 1152 216 L 1202 216"/>
    </circle>

    <!-- Goal Strike Explosion Indicator -->
    <g class="goal-burst">
      <circle cx="1202" cy="216" r="16" fill="none" stroke="#059669" stroke-width="2"/>
      <rect x="1130" y="180" width="70" height="22" rx="11" fill="#ecfdf5" stroke="#059669"/>
      <text x="1165" y="195" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#059669">GOAL! ⚽</text>
    </g>

    <!-- Tactical Nodes with Pulse Rings & Hover Physics -->
    <!-- Node 1: CDM -->
    <g class="tactical-node" transform="translate(845, 258)">
      <circle class="pulse-ring" cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#0284c7"/>
      <rect x="-38" y="10" width="76" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" opacity="0.95"/>
      <text x="0" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">CDM · 94%</text>
    </g>

    <!-- Node 2: CAM (Playmaker) -->
    <g class="tactical-node" transform="translate(945, 170)">
      <circle class="pulse-ring" cx="0" cy="0" r="4" fill="none" stroke="#0284c7" stroke-width="1.5" style="animation-delay: 1.05s;"/>
      <circle cx="0" cy="0" r="5.5" fill="#0284c7"/>
      <rect x="-46" y="-28" width="92" height="20" rx="10" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.5" opacity="0.95"/>
      <text x="0" y="-14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#0284c7">xT +0.42 · CAM</text>
    </g>

    <!-- Node 3: RW (Inverted Winger) -->
    <g class="tactical-node" transform="translate(1055, 162)">
      <circle class="pulse-ring" cx="0" cy="0" r="4" fill="none" stroke="#059669" stroke-width="1.5" style="animation-delay: 2.1s;"/>
      <circle cx="0" cy="0" r="5" fill="#059669"/>
      <rect x="-44" y="-28" width="88" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" opacity="0.95"/>
      <text x="0" y="-14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#059669">Key Cross · RW</text>
    </g>

    <!-- Node 4: CF (Finisher) -->
    <g class="tactical-node" transform="translate(1152, 216)">
      <circle class="pulse-ring" cx="0" cy="0" r="4" fill="none" stroke="#d97706" stroke-width="1.5" style="animation-delay: 3.15s;"/>
      <circle cx="0" cy="0" r="6" fill="#d97706"/>
      <rect x="-46" y="10" width="92" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d" opacity="0.95"/>
      <text x="0" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#b45309">xG 0.84 🎯</text>
    </g>
  </g>
  <rect x="736" y="98" width="480" height="236" rx="14" fill="none" stroke="#cbd5e1"/>

  <!-- Live Match Momentum Mini-Bar at Pitch Base -->
  <g transform="translate(736, 348)">
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">MOMENTUM:</text>
    <rect x="74" y="5" width="260" height="10" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="74" y="5" width="194" height="10" rx="5" fill="url(#radarBeamLight)"/>
    <text x="342" y="14" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#059669">+74.6% ATTACK BIAS</text>
    <text x="480" y="14" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">OPTA/STATS DATA ↗</text>
  </g>
</g>
</svg>