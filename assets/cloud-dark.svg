<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Cloud &amp; MERN Stack Applications">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset=".5" stop-color="#fbbf24" stop-opacity=".06"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="210" fill="#0c1219"/>
<rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
<rect x="28" y="0" width="64" height="1.5" fill="#fbbf24"/>
</g>
<rect x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#1e2c3d"/>
<text x="28" y="54" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="27" font-weight="400" letter-spacing="-0.3" fill="#f1f5f9">Cloud &amp; MERN Stack</text>
<rect x="444" y="34" width="128" height="26" rx="13" fill="none" stroke="#1e2c3d"/>
<circle class="live" cx="458" cy="47" r="3" fill="#fbbf24"/>
<text x="468" y="51.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">AWS Certified</text>
<text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">
<tspan x="28" dy="0">Scalable full-stack systems designed with React, Node.js, Express,</tspan>
<tspan x="28" dy="22">MongoDB, secure JWT auth, and cloud-native AWS architecture.</tspan>
</text>
