<rect x="232.4" y="140" width="76" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="245.4" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">Node.js</text>
<rect x="314.6" y="140" width="86" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="327.6" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">MongoDB</text>
