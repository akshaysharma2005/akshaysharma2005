<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a0f1e"/>
    <stop offset="50%" stop-color="#0d1b2a"/>
    <stop offset="100%" stop-color="#0a0f1e"/>
  </linearGradient>
  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/>
    <stop offset="30%" stop-color="#00ff87"/>
    <stop offset="70%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d2818"/>
    <stop offset="100%" stop-color="#0a1f12"/>
  </linearGradient>
  <linearGradient id="glowGreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ff87" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glowBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glowAmber" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffb800" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#ffb800" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bgBlur"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="mainClip"><rect width="1280" height="320" rx="0"/></clipPath>
</defs>

<g clip-path="url(#mainClip)">

<!-- Background -->
<rect width="1280" height="320" fill="url(#bg)"/>

<!-- Subtle grid lines -->
<g opacity="0.04" stroke="#00ff87" stroke-width="0.5">
  <line x1="0" y1="80" x2="1280" y2="80"/>
  <line x1="0" y1="160" x2="1280" y2="160"/>
  <line x1="0" y1="240" x2="1280" y2="240"/>
  <line x1="320" y1="0" x2="320" y2="320"/>
  <line x1="640" y1="0" x2="640" y2="320"/>
  <line x1="960" y1="0" x2="960" y2="320"/>
</g>

<!-- Ambient glows -->
<circle cx="200" cy="160" r="180" fill="#00ff87" opacity="0.04" filter="url(#bgBlur)"/>
<circle cx="1080" cy="160" r="180" fill="#00d4ff" opacity="0.04" filter="url(#bgBlur)"/>

<!-- ═══ LEFT SECTION: Identity ═══ -->
<g transform="translate(60, 0)">
  <!-- Top accent bar -->
  <rect x="0" y="44" width="3" height="60" fill="#00ff87" rx="2"/>
  
  <!-- Name -->
  <text x="20" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-1">M AKSHAY</text>
  <text x="20" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="#00ff87" letter-spacing="-1">SHARMA</text>

  <!-- Role tags -->
  <rect x="20" y="138" width="142" height="24" rx="12" fill="#00ff87" fill-opacity="0.12" stroke="#00ff87" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="91" y="154" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="600" fill="#00ff87" letter-spacing="1">DATA ANALYTICS</text>

  <rect x="172" y="138" width="148" height="24" rx="12" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="246" y="154" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="600" fill="#00d4ff" letter-spacing="1">FULL-STACK DEV</text>

  <!-- University -->
  <text x="20" y="195" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">VIT-AP University · B.Tech Computer Science</text>

  <!-- Divider -->
  <line x1="20" y1="215" x2="360" y2="215" stroke="#1e293b" stroke-width="1"/>

  <!-- Quick stats row -->
  <g transform="translate(20, 235)">
    <text x="0" y="14" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3+</text>
    <text x="0" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">PROJECTS</text>
    
    <text x="80" y="14" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">AWS</text>
    <text x="80" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">CERTIFIED</text>
    
    <text x="170" y="14" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2026</text>
    <text x="170" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">GRADUATE</text>
  </g>
</g>

<!-- ═══ CENTER DIVIDER ═══ -->
<line x1="500" y1="40" x2="500" y2="280" stroke="#1e293b" stroke-width="1"/>

<!-- ═══ CENTER SECTION: Football Pitch ═══ -->
<g transform="translate(530, 30)">
  
  <!-- Pitch box -->
  <rect x="0" y="0" width="300" height="260" rx="8" fill="url(#pitchGrad)" stroke="#1a4a28" stroke-width="1.5"/>
  
  <!-- Pitch markings -->
  <!-- Center circle -->
  <circle cx="150" cy="130" r="50" fill="none" stroke="#1e5c30" stroke-width="1.2"/>
  <!-- Center spot -->
  <circle cx="150" cy="130" r="3" fill="#1e5c30"/>
  <!-- Halfway line -->
  <line x1="0" y1="130" x2="300" y2="130" stroke="#1e5c30" stroke-width="1"/>
  <!-- Outer boundary inner lines -->
  <rect x="8" y="8" width="284" height="244" fill="none" stroke="#1e5c30" stroke-width="0.8"/>
  
  <!-- Left penalty box -->
  <rect x="8" y="82" width="60" height="96" fill="none" stroke="#1e5c30" stroke-width="1"/>
  <rect x="8" y="105" width="28" height="50" fill="none" stroke="#1e5c30" stroke-width="0.7"/>
  <!-- Left goal -->
  <rect x="0" y="112" width="8" height="36" fill="#1e5c30" opacity="0.5"/>
  
  <!-- Right penalty box -->
  <rect x="232" y="82" width="60" height="96" fill="none" stroke="#1e5c30" stroke-width="1"/>
  <rect x="264" y="105" width="28" height="50" fill="none" stroke="#1e5c30" stroke-width="0.7"/>
  <!-- Right goal -->
  <rect x="292" y="112" width="8" height="36" fill="#1e5c30" opacity="0.5"/>
  
  <!-- Penalty spots -->
  <circle cx="64" cy="130" r="2.5" fill="#1e5c30"/>
  <circle cx="236" cy="130" r="2.5" fill="#1e5c30"/>

  <!-- PLAYERS — Formation 4-3-3 -->
  <!-- GK -->
  <circle cx="20" cy="130" r="9" fill="#0a0f1e" stroke="#00ff87" stroke-width="2"/>
  <text x="20" y="134" text-anchor="middle" font-family="monospace" font-size="7.5" font-weight="700" fill="#00ff87">GK</text>
  
  <!-- Defenders -->
  <circle cx="72" cy="68" r="9" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="72" y="72" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff">LB</text>
  
  <circle cx="72" cy="104" r="9" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="72" y="108" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff">CB</text>
  
  <circle cx="72" cy="156" r="9" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="72" y="160" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff">CB</text>
  
  <circle cx="72" cy="192" r="9" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="72" y="196" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff">RB</text>
  
  <!-- Midfielders -->
  <circle cx="138" cy="86" r="9" fill="#0a0f1e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="138" y="90" text-anchor="middle" font-family="monospace" font-size="7" fill="#a78bfa">CM</text>
  
  <circle cx="138" cy="130" r="10" fill="#0a0f1e" stroke="#00ff87" stroke-width="2.5"/>
  <text x="138" y="134" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#00ff87">CAM</text>
  <!-- Pulse ring on CAM -->
  <circle cx="138" cy="130" r="15" fill="none" stroke="#00ff87" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="10;20;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="138" cy="174" r="9" fill="#0a0f1e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="138" y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#a78bfa">CM</text>
  
  <!-- Forwards -->
  <circle cx="216" cy="68" r="9" fill="#0a0f1e" stroke="#ffb800" stroke-width="1.8"/>
  <text x="216" y="72" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffb800">LW</text>
  
  <circle cx="240" cy="130" r="10" fill="#ffb800" stroke="#ffb800" stroke-width="2"/>
  <text x="240" y="134" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#0a0f1e">ST</text>
  <!-- Pulse on ST -->
  <circle cx="240" cy="130" r="15" fill="none" stroke="#ffb800" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="216" cy="192" r="9" fill="#0a0f1e" stroke="#ffb800" stroke-width="1.8"/>
  <text x="216" y="196" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffb800">RW</text>

  <!-- Pass lines (animated) -->
  <line x1="20" y1="130" x2="72" y2="104" stroke="#00ff87" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="72" y1="104" x2="138" y2="130" stroke="#00ff87" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="138" y1="130" x2="240" y2="130" stroke="#ffb800" stroke-width="2" stroke-dasharray="5 3" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="138" y1="130" x2="216" y2="68" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Animated ball -->
  <circle r="4" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 138 130 L 240 130 L 216 68 L 138 86 L 138 130"/>
  </circle>
  
  <!-- Label -->
  <text x="150" y="276" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" font-weight="600" fill="#1e5c30" letter-spacing="2">4 - 3 - 3 FORMATION</text>
</g>

<!-- ═══ RIGHT SECTION: Skills & Stats ═══ -->
<line x1="860" y1="40" x2="860" y2="280" stroke="#1e293b" stroke-width="1"/>

<g transform="translate(890, 44)">
  
  <!-- Section title -->
  <text x="0" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">SKILL METRICS</text>
  
  <!-- Skill bars -->
  <!-- Python -->
  <g transform="translate(0, 38)">
    <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e2e8f0">Python</text>
    <text x="330" y="13" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#00ff87">92%</text>
    <rect x="0" y="18" width="330" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="0" y="18" width="304" height="5" rx="2.5" fill="url(#glowGreen)">
      <animate attributeName="width" from="0" to="304" dur="1.5s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- SQL -->
  <g transform="translate(0, 80)">
    <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e2e8f0">SQL / Data Analytics</text>
    <text x="330" y="13" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#00ff87">88%</text>
    <rect x="0" y="18" width="330" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="0" y="18" width="290" height="5" rx="2.5" fill="url(#glowGreen)">
      <animate attributeName="width" from="0" to="290" dur="1.7s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- React -->
  <g transform="translate(0, 122)">
    <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e2e8f0">React / Full-Stack</text>
    <text x="330" y="13" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#00d4ff">83%</text>
    <rect x="0" y="18" width="330" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="0" y="18" width="274" height="5" rx="2.5" fill="url(#glowBlue)">
      <animate attributeName="width" from="0" to="274" dur="1.9s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- ML -->
  <g transform="translate(0, 164)">
    <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e2e8f0">Machine Learning</text>
    <text x="330" y="13" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#00d4ff">79%</text>
    <rect x="0" y="18" width="330" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="0" y="18" width="261" height="5" rx="2.5" fill="url(#glowBlue)">
      <animate attributeName="width" from="0" to="261" dur="2s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- Football IQ -->
  <g transform="translate(0, 206)">
    <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e2e8f0">Football IQ ⚽</text>
    <text x="330" y="13" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#ffb800">97%</text>
    <rect x="0" y="18" width="330" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="0" y="18" width="320" height="5" rx="2.5" fill="url(#glowAmber)">
      <animate attributeName="width" from="0" to="320" dur="1.2s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- AWS badge -->
  <g transform="translate(0, 245)">
    <rect width="150" height="26" rx="13" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="75" y="17" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700" fill="#ff9900" letter-spacing="0.5">☁ AWS CERTIFIED</text>
    
    <rect x="160" y="0" width="170" height="26" rx="13" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="245" y="17" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700" fill="#a78bfa" letter-spacing="0.5">VIT-AP UNIVERSITY</text>
  </g>
</g>

<!-- ═══ BOTTOM ACCENT LINE ═══ -->
<rect x="0" y="315" width="1280" height="5" fill="url(#accentLine)" opacity="0.7"/>

<!-- ═══ TOP THIN ACCENT ═══ -->
<rect x="0" y="0" width="1280" height="2" fill="url(#accentLine)" opacity="0.5"/>

</g>
</svg>