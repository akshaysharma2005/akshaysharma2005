<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="PitchPulse — Football Tactical and xG Analytics Engine">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#10b981" stop-opacity="0"/><stop offset=".5" stop-color="#10b981" stop-opacity=".06"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="210" fill="#0c1219"/>
<rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
<rect x="28" y="0" width="64" height="1.5" fill="#10b981"/>
</g>
<rect x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#1e2c3d"/>
<text x="28" y="54" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="27" font-weight="400" letter-spacing="-0.3" fill="#f1f5f9">PitchPulse ⚽</text>
<rect x="444" y="34" width="128" height="26" rx="13" fill="none" stroke="#1e2c3d"/>
<circle class="live" cx="458" cy="47" r="3" fill="#10b981"/>
<text x="468" y="51.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">Match Telemetry</text>
<text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">
<tspan x="28" dy="0">Spatial event tracking, expected goals (xG), passing networks,</tspan>
<tspan x="28" dy="22">and player performance radars modeled from matchday event logs.</tspan>
</text>
<rect x="28" y="140" width="86" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="41" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">xG Models</text>
<rect x="120.2" y="140" width="86" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="133.2" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">StatsBomb</text>
<rect x="212.4" y="140" width="70" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="225.4" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">Python</text>
<rect x="288.6" y="140" width="102" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="301.6" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">Radar Charts</text>
<rect x="396.8" y="140" width="96" height="28" rx="14" fill="#0f1923" stroke="#1e2c3d"/><text x="409.8" y="158.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">Pass Matrix</text>
<text x="572" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#64748b">github.com/akshaysharma2005/football-analytics ↗</text>
</svg>
