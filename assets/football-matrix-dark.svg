<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Football Analytics Lab — Tactical Matrix, Shot Map, and Playmaker Radar">
<style>
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(1420px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ringPulse{0%{r:4;opacity:0.95}100%{r:16;opacity:0}}
@keyframes radarBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes dashFlow{to{stroke-dashoffset:-24}}
@keyframes shotGlow{0%,100%{opacity:0.4;r:7}50%{opacity:0.95;r:9}}

.sweep{animation:sweep 7s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
.pulse-ring{animation:ringPulse 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite}
.radar-shape{animation:radarBreath 4s ease-in-out infinite;transform-origin:1052px 174px}
.flow-line{animation:dashFlow 1.2s linear infinite}
.shot-pulse{animation:shotGlow 2s ease-in-out infinite}

.hud-panel{transition:all .3s ease;cursor:pointer}
.hud-panel:hover{stroke:#10b981;filter:drop-shadow(0 0 10px rgba(16,185,129,0.2))}
.shot-node{transition:transform .2s ease;cursor:pointer}
.shot-node:hover{transform:scale(1.3)}
</style>
<defs>
<linearGradient id="shineF" x1="0" x2="1">
  <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
  <stop offset=".5" stop-color="#10b981" stop-opacity=".06"/>
  <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
</linearGradient>
<radialGradient id="shotGlowGrad" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
</radialGradient>
<filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
  <feMerge>
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<clipPath id="fclip">
  <rect x="1" y="1" width="1278" height="298" rx="18"/>
</clipPath>
</defs>

<!-- Background -->
<g clip-path="url(#fclip)">
  <rect width="1280" height="300" fill="#080c11"/>
  <rect class="sweep" x="0" y="0" width="140" height="300" fill="url(#shineF)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#1e2c3d"/>

<!-- Card Header -->
<circle class="live" cx="44" cy="38" r="3.5" fill="#10b981"/>
<text x="58" y="42" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2" fill="#64748b">
  FOOTBALL ANALYTICS LAB · TACTICAL MATRIX &amp; xG ENGINE
</text>
<text x="1236" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#10b981">
  ⚽ POSSESSION · HIGH-PRESSING · SPATIAL THREAT
</text>
<line x1="40" x2="1240" y1="60" y2="60" stroke="#1e2c3d"/>

<!-- 3 Columns Layout -->

<!-- Column 1: Positional Play & Passing Network -->
<g class="hud-panel" transform="translate(48, 76)">
  <rect width="364" height="202" rx="12" fill="#0c141d" stroke="#1b2c3d"/>
  <text x="18" y="26" font-family="'Iowan Old Style', Palatino, serif" font-size="17" fill="#f1f5f9">Passing Network &amp; Structure</text>
  <text x="18" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">POSSESSION SYSTEM: 4-3-3</text>

  <!-- Interactive Network Mini-Map -->
  <g transform="translate(18, 56)">
    <!-- Pitch Mini Boundary -->
    <rect width="328" height="92" rx="6" fill="#070e14" stroke="#162534"/>
    <line x1="164" y1="0" x2="164" y2="92" stroke="#162534" stroke-dasharray="2 3"/>

    <!-- Passing Flow Lines -->
    <!-- CB (40, 46) -> CDM (110, 60) -->
    <line class="flow-line" x1="40" y1="46" x2="110" y2="60" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 4"/>
    <!-- CDM (110, 60) -> CAM (180, 30) -->
    <line class="flow-line" x1="110" y1="60" x2="180" y2="30" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4 4"/>
    <!-- CAM (180, 30) -> RW (250, 22) -->
    <line class="flow-line" x1="180" y1="30" x2="250" y2="22" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 4"/>
    <!-- CAM (180, 30) -> ST (280, 62) -->
    <line class="flow-line" x1="180" y1="30" x2="280" y2="62" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- RW (250, 22) -> ST (280, 62) -->
    <line class="flow-line" x1="250" y1="22" x2="280" y2="62" stroke="#10b981" stroke-width="1.6" stroke-dasharray="3 3"/>

    <!-- Nodes with Pulse -->
    <!-- CB -->
    <circle cx="40" cy="46" r="4.5" fill="#38bdf8"/>
    <text x="40" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">CB</text>

    <!-- CDM -->
    <circle class="pulse-ring" cx="110" cy="60" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="110" cy="60" r="5.5" fill="#38bdf8"/>
    <text x="110" y="78" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#38bdf8">CDM · 94%</text>

    <!-- CAM (Hub) -->
    <circle class="pulse-ring" cx="180" cy="30" r="4" fill="none" stroke="#10b981" stroke-width="1.5" style="animation-delay: 0.8s;"/>
    <circle cx="180" cy="30" r="6.5" fill="#10b981"/>
    <text x="180" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34d399">CAM (Hub)</text>

    <!-- RW -->
    <circle cx="250" cy="22" r="5" fill="#10b981"/>
    <text x="250" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">RW</text>

    <!-- ST -->
    <circle class="pulse-ring" cx="280" cy="62" r="4" fill="none" stroke="#fbbf24" stroke-width="1.5" style="animation-delay: 1.6s;"/>
    <circle cx="280" cy="62" r="6" fill="#fbbf24"/>
    <text x="280" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#fbbf24">ST ⚽</text>

    <!-- Animated Data Packet moving along attack -->
    <circle r="2.5" fill="#ffffff" filter="url(#glowF)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M 40 46 L 110 60 L 180 30 L 250 22 L 280 62"/>
    </circle>
  </g>

  <!-- Metrics Footer -->
  <g transform="translate(18, 160)">
    <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Field Tilt: <tspan fill="#34d399" font-weight="600">68.4%</tspan></text>
    <text x="110" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Pass Acc: <tspan fill="#38bdf8" font-weight="600">89.2%</tspan></text>
    <text x="218" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">PPDA: <tspan fill="#f43f5e" font-weight="600">7.8</tspan></text>
    <text x="0" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">OVERLOADS · HALF-SPACES · HIGH LINE</text>
  </g>
</g>

<!-- Column 2: Expected Goals (xG) Shot Map HUD -->
<g class="hud-panel" transform="translate(432, 76)">
  <rect width="364" height="202" rx="12" fill="#0c141d" stroke="#1b2c3d"/>
  <text x="18" y="26" font-family="'Iowan Old Style', Palatino, serif" font-size="17" fill="#f1f5f9">Expected Goals (xG) Shot Map</text>
  <text x="18" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">MATCHDAY SHOT DISTRIBUTION &amp; QUALITY</text>

  <!-- Penalty Box Shot Map Area -->
  <g transform="translate(18, 56)">
    <rect width="328" height="92" rx="6" fill="#070e14" stroke="#162534"/>
    
    <!-- 18-yard box line and Goalmouth -->
    <rect x="22" y="14" width="284" height="78" fill="none" stroke="#1c2d3e" stroke-width="1.2"/>
    <rect x="100" y="14" width="128" height="34" fill="none" stroke="#1c2d3e" stroke-width="1"/>
    <!-- Goal mouth at top -->
    <rect x="124" y="8" width="80" height="6" fill="#10b981" opacity="0.8"/>
    <circle cx="164" cy="58" r="2" fill="#1c2d3e"/>

    <!-- Shot 1: Goal ⚽ (xG: 0.76) - High Danger Central -->
    <g class="shot-node" transform="translate(164, 40)">
      <circle class="shot-pulse" cx="0" cy="0" r="8" fill="#10b981" opacity="0.9"/>
      <circle class="pulse-ring" cx="0" cy="0" r="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <line x1="0" y1="0" x2="-6" y2="-28" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="12" y="4" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34d399">GOAL (0.76) ⚽</text>
    </g>

    <!-- Shot 2: Saved (xG: 0.34) - Right Channel -->
    <g class="shot-node" transform="translate(220, 48)">
      <circle cx="0" cy="0" r="5.5" fill="#38bdf8" opacity="0.85"/>
      <line x1="0" y1="0" x2="-40" y2="-36" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="8" y="3" font-family="ui-monospace, monospace" font-size="8.5" fill="#38bdf8">Saved (0.34)</text>
    </g>

    <!-- Shot 3: Post (xG: 0.42) - Left Channel -->
    <g class="shot-node" transform="translate(108, 46)">
      <circle cx="0" cy="0" r="6" fill="#fbbf24" opacity="0.85"/>
      <line x1="0" y1="0" x2="22" y2="-34" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="-62" y="3" font-family="ui-monospace, monospace" font-size="8.5" fill="#fbbf24">Post (0.42)</text>
    </g>

    <!-- Shot 4: Blocked Long Shot (xG: 0.08) - Outside Box -->
    <g class="shot-node" transform="translate(186, 78)">
      <circle cx="0" cy="0" r="3.5" fill="#64748b"/>
      <text x="6" y="3" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Blocked (0.08)</text>
    </g>
  </g>

  <!-- Shot Map Legend & Stats -->
  <g transform="translate(18, 160)">
    <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Match xG: <tspan fill="#34d399" font-weight="600">2.48</tspan> <tspan font-size="10" fill="#64748b">(Actual: 3)</tspan></text>
    <text x="140" y="14" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">xT Generated: <tspan fill="#38bdf8" font-weight="600">+1.64</tspan></text>
    <text x="0" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">LOGISTIC REGRESSION ON 15,000+ HISTORICAL SHOTS</text>
  </g>
</g>

<!-- Column 3: Geometric Spider Radar (Playmaker Hexagon) -->
<g class="hud-panel" transform="translate(816, 76)">
  <rect width="416" height="202" rx="12" fill="#0c141d" stroke="#1b2c3d"/>
  <text x="18" y="26" font-family="'Iowan Old Style', Palatino, serif" font-size="17" fill="#f1f5f9">Playmaker Scouting Radar</text>
  <text x="18" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">MULTI-DIMENSIONAL ATTRIBUTE EVALUATION</text>

  <!-- Interactive Hexagonal Spider Radar Chart -->
  <g transform="translate(208, 124)">
    <!-- Concentric Hexagon Grid Rings -->
    <!-- 40% ring -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#162534" stroke-width="1"/>
    <!-- 70% ring -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#1c2d3e" stroke-width="1"/>
    <!-- 100% outer ring -->
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="none" stroke="#253a50" stroke-width="1.2"/>

    <!-- 6 Axes radiating from center -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#1c2d3e" stroke-width="1"/>
    <line x1="0" y1="0" x2="50" y2="-29" stroke="#1c2d3e" stroke-width="1"/>
    <line x1="0" y1="0" x2="50" y2="29" stroke="#1c2d3e" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="58" stroke="#1c2d3e" stroke-width="1"/>
    <line x1="0" y1="0" x2="-50" y2="29" stroke="#1c2d3e" stroke-width="1"/>
    <line x1="0" y1="0" x2="-50" y2="-29" stroke="#1c2d3e" stroke-width="1"/>

    <!-- Animated Radar Attribute Polygon (High Percentile Playmaker Profile) -->
    <!-- Values: Vision: 96, KeyPass: 93, PressRes: 94, SpatialIQ: 96, Tempo: 92, BoxThreat: 84 -->
    <polygon class="radar-shape" points="0,-56 46,-27 47,27 0,55 -47,27 -48,-28" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2" filter="url(#glowF)"/>

    <!-- Axis Attribute Badges & Labels -->
    <!-- Top: Spatial IQ (96) -->
    <text x="0" y="-66" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#34d399">Spatial IQ · 96</text>
    <circle cx="0" cy="-56" r="3" fill="#ffffff"/>

    <!-- Top Right: Vision (96) -->
    <text x="56" y="-32" text-anchor="start" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Vision <tspan fill="#38bdf8" font-weight="600">96</tspan></text>
    <circle cx="46" cy="-27" r="3" fill="#38bdf8"/>

    <!-- Bottom Right: Key Pass (93) -->
    <text x="56" y="32" text-anchor="start" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Key Pass <tspan fill="#fbbf24" font-weight="600">93</tspan></text>
    <circle cx="47" cy="27" r="3" fill="#fbbf24"/>

    <!-- Bottom: Press Resist (94) -->
    <text x="0" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">Press Resist · <tspan fill="#34d399" font-weight="600">94</tspan></text>
    <circle cx="0" cy="55" r="3" fill="#34d399"/>

    <!-- Bottom Left: Match Tempo (92) -->
    <text x="-56" y="32" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8"><tspan fill="#a78bfa" font-weight="600">92</tspan> Tempo</text>
    <circle cx="-47" cy="27" r="3" fill="#a78bfa"/>

    <!-- Top Left: Box Threat (84) -->
    <text x="-56" y="-32" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8"><tspan fill="#f43f5e" font-weight="600">84</tspan> Threat</text>
    <circle cx="-48" cy="-28" r="3" fill="#f43f5e"/>
  </g>
</g>
</svg>
