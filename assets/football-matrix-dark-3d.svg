<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a0f1e"/>
    <stop offset="50%" stop-color="#0d1b2a"/>
    <stop offset="100%" stop-color="#0a0f1e"/>
  </linearGradient>
  <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/>
    <stop offset="30%" stop-color="#00ff87"/>
    <stop offset="70%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="xgBarG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ff87"/>
    <stop offset="100%" stop-color="#00ff87" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="xgBarA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffb800"/>
    <stop offset="100%" stop-color="#ffb800" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="xgBarB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="xgBarR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ef4444"/>
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="radarFill2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00ff87" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1"/>
  </linearGradient>
  <filter id="glow2">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bgBlur2"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="clip2"><rect width="1280" height="280"/></clipPath>
</defs>

<g clip-path="url(#clip2)">

<!-- Background -->
<rect width="1280" height="280" fill="url(#bg2)"/>
<g opacity="0.03" stroke="#00ff87" stroke-width="0.5">
  <line x1="0" y1="70" x2="1280" y2="70"/>
  <line x1="0" y1="140" x2="1280" y2="140"/>
  <line x1="0" y1="210" x2="1280" y2="210"/>
  <line x1="426" y1="0" x2="426" y2="280"/>
  <line x1="853" y1="0" x2="853" y2="280"/>
</g>
<circle cx="213" cy="140" r="160" fill="#00ff87" opacity="0.04" filter="url(#bgBlur2)"/>
<circle cx="640" cy="140" r="160" fill="#ffb800" opacity="0.03" filter="url(#bgBlur2)"/>
<circle cx="1067" cy="140" r="160" fill="#00d4ff" opacity="0.04" filter="url(#bgBlur2)"/>

<!-- Top / Bottom accent lines -->
<rect x="0" y="0" width="1280" height="2" fill="url(#accentH)" opacity="0.6"/>
<rect x="0" y="278" width="1280" height="2" fill="url(#accentH)" opacity="0.6"/>

<!-- ═══════════════════════════════
     PANEL 1 — xG Shot Map Bars
════════════════════════════════ -->
<g transform="translate(40, 0)">
  
  <!-- Panel label -->
  <rect x="0" y="18" width="3" height="36" fill="#00ff87" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">xG Shot Analysis</text>
  <text x="14" y="52" font-family="monospace" font-size="10" fill="#334155" letter-spacing="1.5">EXPECTED GOALS PER ZONE</text>

  <!-- Vertical bar chart -->
  <!-- Zone labels at bottom -->
  <text x="50" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">6-yd</text>
  <text x="110" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">Pen</text>
  <text x="170" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">D-L</text>
  <text x="230" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">D-R</text>
  <text x="290" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">Far</text>
  <text x="350" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">FK</text>

  <!-- Base line -->
  <line x1="20" y1="225" x2="390" y2="225" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Y-axis labels -->
  <text x="14" y="228" text-anchor="end" font-family="monospace" font-size="9" fill="#334155">0</text>
  <text x="14" y="175" text-anchor="end" font-family="monospace" font-size="9" fill="#334155">.5</text>
  <text x="14" y="122" text-anchor="end" font-family="monospace" font-size="9" fill="#334155">1.0</text>
  <line x1="18" y1="172" x2="390" y2="172" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="18" y1="120" x2="390" y2="120" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Bar: 6-yd box — xG 0.82 -->
  <rect x="26" y="72" width="48" height="153" rx="4" fill="url(#xgBarG)" opacity="0.9"/>
  <rect x="26" y="72" width="48" height="3" rx="2" fill="#00ff87" filter="url(#glow2)"/>
  <text x="50" y="66" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#00ff87">0.82</text>

  <!-- Bar: Penalty — xG 0.76 -->
  <rect x="86" y="82" width="48" height="143" rx="4" fill="url(#xgBarG)" opacity="0.75"/>
  <rect x="86" y="82" width="48" height="3" rx="2" fill="#00ff87" filter="url(#glow2)"/>
  <text x="110" y="76" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#00ff87">0.76</text>

  <!-- Bar: D-Left — xG 0.43 -->
  <rect x="146" y="144" width="48" height="81" rx="4" fill="url(#xgBarA)" opacity="0.85"/>
  <rect x="146" y="144" width="48" height="3" rx="2" fill="#ffb800" filter="url(#glow2)"/>
  <text x="170" y="138" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffb800">0.43</text>

  <!-- Bar: D-Right — xG 0.38 -->
  <rect x="206" y="153" width="48" height="72" rx="4" fill="url(#xgBarA)" opacity="0.75"/>
  <rect x="206" y="153" width="48" height="3" rx="2" fill="#ffb800" filter="url(#glow2)"/>
  <text x="230" y="147" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffb800">0.38</text>

  <!-- Bar: Far post — xG 0.12 -->
  <rect x="266" y="202" width="48" height="23" rx="4" fill="url(#xgBarB)" opacity="0.8"/>
  <rect x="266" y="202" width="48" height="3" rx="2" fill="#00d4ff" filter="url(#glow2)"/>
  <text x="290" y="196" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#00d4ff">0.12</text>

  <!-- Bar: Free kick — xG 0.07 -->
  <rect x="326" y="212" width="48" height="13" rx="4" fill="url(#xgBarR)" opacity="0.8"/>
  <rect x="326" y="212" width="48" height="3" rx="2" fill="#ef4444" filter="url(#glow2)"/>
  <text x="350" y="206" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ef4444">0.07</text>

  <!-- Bottom stats -->
  <text x="14" y="265" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#64748b">Total xG: <tspan fill="#00ff87" font-weight="700">2.58</tspan>  ·  Goals: <tspan fill="#ffffff" font-weight="700">3</tspan>  ·  Shots: <tspan fill="#00d4ff" font-weight="700">14</tspan></text>
</g>

<!-- Vertical divider -->
<line x1="430" y1="20" x2="430" y2="260" stroke="#1e293b" stroke-width="1"/>

<!-- ═══════════════════════════════
     PANEL 2 — Pass Network Map
════════════════════════════════ -->
<g transform="translate(450, 0)">

  <rect x="0" y="18" width="3" height="36" fill="#00d4ff" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Pass Network</text>
  <text x="14" y="52" font-family="monospace" font-size="10" fill="#334155" letter-spacing="1.5">TOUCH MAP &amp; CONNECTIONS</text>

  <!-- Mini half-pitch -->
  <rect x="14" y="65" width="370" height="185" rx="6" fill="#0d1f14" stroke="#1a3d20" stroke-width="1"/>
  <rect x="20" y="70" width="358" height="175" fill="none" stroke="#1a3d20" stroke-width="0.7"/>
  <!-- Penalty arc -->
  <path d="M 14 140 Q 80 115 80 140 Q 80 165 14 140" fill="none" stroke="#1a3d20" stroke-width="0.7"/>
  <!-- Goal -->
  <rect x="14" y="122" width="10" height="36" fill="#1a3d20"/>

  <!-- CONNECTION LINES (drawn first so nodes go on top) -->
  <!-- GK → CB1 (thick = many passes) -->
  <line x1="42" y1="140" x2="118" y2="112" stroke="#00d4ff" stroke-width="2.5" stroke-dasharray="5 3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- GK → CB2 -->
  <line x1="42" y1="140" x2="118" y2="168" stroke="#00d4ff" stroke-width="2" stroke-dasharray="5 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- CB1 → CDM -->
  <line x1="118" y1="112" x2="198" y2="130" stroke="#00ff87" stroke-width="2.5" stroke-dasharray="5 3" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </line>
  <!-- CB2 → CDM -->
  <line x1="118" y1="168" x2="198" y2="130" stroke="#00ff87" stroke-width="2" stroke-dasharray="5 3" opacity="0.45">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </line>
  <!-- LB → LCM -->
  <line x1="118" y1="82" x2="198" y2="96" stroke="#00d4ff" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- RB → RCM -->
  <line x1="118" y1="198" x2="198" y2="164" stroke="#00d4ff" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- CDM → CAM (KEY pass) -->
  <line x1="198" y1="130" x2="280" y2="130" stroke="#00ff87" stroke-width="3" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <!-- LCM → LW -->
  <line x1="198" y1="96" x2="280" y2="82" stroke="#ffb800" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- RCM → RW -->
  <line x1="198" y1="164" x2="280" y2="178" stroke="#ffb800" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- CAM → ST -->
  <line x1="280" y1="130" x2="358" y2="130" stroke="#ffb800" stroke-width="3" stroke-dasharray="5 3" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- Nodes: sizes = touch count -->
  <!-- GK -->
  <circle cx="42" cy="140" r="11" fill="#0a0f1e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="144" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">GK</text>
  
  <!-- LB -->
  <circle cx="118" cy="82" r="10" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="118" y="86" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4ff">LB</text>
  
  <!-- CB1 -->
  <circle cx="118" cy="112" r="12" fill="#0a0f1e" stroke="#00d4ff" stroke-width="2"/>
  <text x="118" y="116" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#00d4ff">CB</text>
  
  <!-- CB2 -->
  <circle cx="118" cy="168" r="12" fill="#0a0f1e" stroke="#00d4ff" stroke-width="2"/>
  <text x="118" y="172" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#00d4ff">CB</text>
  
  <!-- RB -->
  <circle cx="118" cy="198" r="10" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="118" y="202" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4ff">RB</text>
  
  <!-- LCM -->
  <circle cx="198" cy="96" r="11" fill="#0a0f1e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="198" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa">LCM</text>
  
  <!-- CDM — Hub node (biggest) -->
  <circle cx="198" cy="130" r="16" fill="#0a0f1e" stroke="#00ff87" stroke-width="2.5"/>
  <text x="198" y="134" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00ff87">CDM</text>
  <circle cx="198" cy="130" r="22" fill="none" stroke="#00ff87" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="16;26;16" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- RCM -->
  <circle cx="198" cy="164" r="11" fill="#0a0f1e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="198" y="168" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa">RCM</text>
  
  <!-- LW -->
  <circle cx="280" cy="82" r="10" fill="#0a0f1e" stroke="#ffb800" stroke-width="1.8"/>
  <text x="280" y="86" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffb800">LW</text>
  
  <!-- CAM -->
  <circle cx="280" cy="130" r="14" fill="#0a0f1e" stroke="#00ff87" stroke-width="2.2"/>
  <text x="280" y="134" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#00ff87">CAM</text>
  
  <!-- RW -->
  <circle cx="280" cy="178" r="10" fill="#0a0f1e" stroke="#ffb800" stroke-width="1.8"/>
  <text x="280" y="182" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffb800">RW</text>
  
  <!-- ST — Goal scorer -->
  <circle cx="358" cy="130" r="15" fill="#ffb800" stroke="#ffb800" stroke-width="2"/>
  <text x="358" y="134" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#0a0f1e">ST ⚽</text>
  <circle cx="358" cy="130" r="22" fill="none" stroke="#ffb800" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="15;28;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated ball -->
  <circle r="3.5" fill="#ffffff" filter="url(#glow2)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 42 140 L 118 112 L 198 130 L 280 130 L 358 130 L 280 82 L 198 96 L 198 130 L 42 140"/>
  </circle>

  <!-- Bottom stat -->
  <text x="14" y="265" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#64748b">Pass Acc: <tspan fill="#00ff87" font-weight="700">89.2%</tspan>  ·  Touches: <tspan fill="#ffffff" font-weight="700">641</tspan>  ·  Field Tilt: <tspan fill="#00d4ff" font-weight="700">68%</tspan></text>
</g>

<!-- Vertical divider -->
<line x1="857" y1="20" x2="857" y2="260" stroke="#1e293b" stroke-width="1"/>

<!-- ═══════════════════════════════
     PANEL 3 — Radar Chart
════════════════════════════════ -->
<g transform="translate(877, 0)">
  <rect x="0" y="18" width="3" height="36" fill="#a78bfa" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Playmaker Radar</text>
  <text x="14" y="52" font-family="monospace" font-size="10" fill="#334155" letter-spacing="1.5">TACTICAL PERFORMANCE INDEX</text>

  <!-- Radar chart centered -->
  <g transform="translate(200, 155)">
    <!-- Background rings -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#1e293b" stroke-width="1"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#1e293b" stroke-width="1"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#1e293b" stroke-width="1"/>
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#1e293b" stroke-width="1"/>
    <!-- Axis lines -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="-69" y1="-40" x2="69" y2="40" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="-69" y1="40" x2="69" y2="-40" stroke="#1e293b" stroke-width="0.8"/>

    <!-- DATA polygon: Vision=96→77, KeyPass=93→74, Spatial=96→77, PressRes=94→75, Tempo=92→74, Threat=84→67 -->
    <polygon points="0,-77 64,-37 64,37 0,67 -64,37 -64,-37" fill="url(#radarFill2)" stroke="#00ff87" stroke-width="2" opacity="0.9"/>

    <!-- Axis labels with values -->
    <text x="0" y="-90" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff87" font-weight="600">Spatial IQ</text>
    <text x="0" y="-78" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ff87">96</text>
    <circle cx="0" cy="-77" r="4" fill="#00ff87" filter="url(#glow2)"/>

    <text x="88" y="-43" text-anchor="start" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="600">Vision</text>
    <text x="88" y="-31" text-anchor="start" font-family="monospace" font-size="9" fill="#00d4ff">96</text>
    <circle cx="64" cy="-37" r="4" fill="#00d4ff" filter="url(#glow2)"/>

    <text x="88" y="44" text-anchor="start" font-family="monospace" font-size="10" fill="#ffb800" font-weight="600">Key Pass</text>
    <text x="88" y="56" text-anchor="start" font-family="monospace" font-size="9" fill="#ffb800">93</text>
    <circle cx="64" cy="37" r="4" fill="#ffb800" filter="url(#glow2)"/>

    <text x="0" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff87" font-weight="600">Press Resist</text>
    <text x="0" y="102" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ff87">94</text>
    <circle cx="0" cy="67" r="4" fill="#00ff87" filter="url(#glow2)"/>

    <text x="-88" y="44" text-anchor="end" font-family="monospace" font-size="10" fill="#a78bfa" font-weight="600">Tempo</text>
    <text x="-88" y="56" text-anchor="end" font-family="monospace" font-size="9" fill="#a78bfa">92</text>
    <circle cx="-64" cy="37" r="4" fill="#a78bfa" filter="url(#glow2)"/>

    <text x="-88" y="-43" text-anchor="end" font-family="monospace" font-size="10" fill="#ef4444" font-weight="600">Threat</text>
    <text x="-88" y="-31" text-anchor="end" font-family="monospace" font-size="9" fill="#ef4444">84</text>
    <circle cx="-64" cy="-37" r="4" fill="#ef4444" filter="url(#glow2)"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Bottom stat -->
  <text x="14" y="265" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#64748b">Overall Rating: <tspan fill="#00ff87" font-weight="700">92.5</tspan>  ·  PPDA: <tspan fill="#ffb800" font-weight="700">7.8</tspan>  ·  xT: <tspan fill="#00d4ff" font-weight="700">+1.64</tspan></text>
</g>

</g>
</svg>
