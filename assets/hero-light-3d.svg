  <linearGradient id="glowB2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
