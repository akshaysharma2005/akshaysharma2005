  <linearGradient id="glowA2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
  </linearGradient>
  <filter id="glowL">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clipL"><rect width="1280" height="320" rx="0"/></clipPath>
</defs>

<g clip-path="url(#clipL)">
<rect width="1280" height="320" fill="url(#bgL)"/>

