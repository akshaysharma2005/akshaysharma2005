    <stop offset="50%" stop-color="#f1f5f9"/>
    <stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>
  <linearGradient id="accentLineL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
    <stop offset="30%" stop-color="#059669"/>
    <stop offset="70%" stop-color="#0284c7"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pitchL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#dcfce7"/>
    <stop offset="100%" stop-color="#bbf7d0"/>
  </linearGradient>
  <linearGradient id="glowG2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#059669" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
